[package]
name = "ch32v4-i2c-host-tests"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
embassy-sync = "0.8.0"
embassy-hal-internal = "0.5.0"
futures = { version = "0.3.31", default-features = false, features = ["async-await"] }
nb = "1.1.0"
embassy-futures = "0.1.2"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embassy-time = { version = "0.5.1", features = ["mock-driver", "generic-queue-64", "tick-hz-1_000_000"] }

[features]
default = ["embassy"]
embassy = []
