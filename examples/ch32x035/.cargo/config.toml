[build]
target = "riscv32imc-unknown-none-elf"

[target.riscv32imc-unknown-none-elf]
runner = "probe-rs run"
# runner = "wlink flash --enable-sdi-print --watch-serial"
# runner = "wlink -v flash"

[env]
# defmt's compile-time filter defaults to `error` when this is unset, which
# compiles out every `info!`/`warn!` call.
DEFMT_LOG = "info"

# Use the following or build.rs
#rustflags = [
#  "-C", "link-arg=-Tlink.x",
#]
