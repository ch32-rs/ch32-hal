[package]
name = "ch32h417-examples"
version = "0.1.0"
edition = "2021"

[dependencies]
# Default to the V3F hart (boot core). For V5F examples, switch the
# feature to `ch32h417qeu6-v5f` and update the target JSON to use the
# riscv32imafbc-style profile (V5F adds the B extension and ICache).
ch32-hal = { path = "../../", features = [
    "ch32h417qeu6-v3f",
    "memory-x",
    "rt",
] }

qingke = { version = "0.7", features = ["unsafe-trust-wch-atomics"] }
qingke-rt = "0.7"

defmt = "1"
defmt-rtt = "0.4"
embedded-hal = "1.0.0"

[profile.release]
debug = 2
strip = false
lto = false
opt-level = 3

# Pin qingke at local ch32h417-dualcore branch for integration testing.
# Once qingke#23 lands and is republished, replace with version = "0.8".
[patch.crates-io]
qingke = { path = "/Users/mono/Elec/WCH/qingke" }
qingke-rt = { path = "/Users/mono/Elec/WCH/qingke/qingke-rt" }
