[package]
name = "ch32h417-homogeneous"
version = "0.1.0"
edition = "2021"

[dependencies]
# The single-image model: one program, booted by the V3F (hart 0), with hart 1
# started from the same image by `ch32_hal::multicore`.
ch32-hal = { path = "../../..", default-features = false, features = [
    "ch32h417qeu6-v3f",
    "memory-x",
    "rt",
    "exti",
] }

qingke = { version = "0.8.4", features = ["unsafe-trust-wch-atomics", "dual-core"] }
# `highcode`: the startup copies `.highcode` from flash to the zero-wait shared
# SRAM and `mtvec` is taken from there. `link.x` folds all of `.text`/`.rodata`
# into it, so both harts execute from the shared block.
qingke-rt = { version = "0.8.4", features = ["highcode"] }

panic-halt = "1.0"

# Only used by the `dual-core-critical-section` feature below.
critical-section = { version = "1.2.0", optional = true }

embassy-executor = { version = "0.10.0", optional = true, features = [
    "platform-spin",
    "executor-thread",
] }
embassy-time = { version = "0.5.1", optional = true }

[features]
# An executor per hart and the cross-core time driver; see `multicore_embassy`.
embassy = ["ch32-hal/embassy", "dep:embassy-executor", "dep:embassy-time"]

# `multicore`: also exercise `critical_section::with` across the two harts.
# This switch only turns on the example half; the exclusion itself needs qingke
# built with its own `dual-core-critical-section` feature (not released yet —
# use the `dual-core-critical-section` branch of the qingke checkout). Without
# it the example still builds but `cs_value` comes out short on purpose.
dual-core-critical-section = ["dep:critical-section"]

# One image, an Embassy executor on each hart. No time driver on hart 1 yet.
[[bin]]
name = "multicore_embassy"
path = "src/bin/multicore_embassy.rs"
required-features = ["embassy"]

[profile.release]
debug = 2
strip = false
# Both harts execute from the zero-wait shared block, so size costs flash but
# not speed; the whole image may use the chip's full 960 KiB (no V5F slot).
lto = true
opt-level = 3
