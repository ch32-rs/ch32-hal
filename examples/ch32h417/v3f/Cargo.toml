[package]
name = "ch32h417-v3f"
version = "0.1.0"
edition = "2021"

[dependencies]
defmt = "1"
defmt-rtt = { version = "1.3.1", features = ["disable-blocking-mode"] }
# Default to the V3F hart (boot core). For V5F examples, switch the
# feature to `ch32h417qeu6-v5f` and update the target JSON to use the
# riscv32imafbc-style profile (V5F adds the B extension and ICache).
# `embassy` stays off by default. The blocking examples own SysTick through
# `hal::delay`, and only `embassy_systick` opts into the time driver.
ch32-hal = { path = "../../../", default-features = false, features = [
    "ch32h417qeu6-v3f",
    "memory-x",
    "rt",
    "exti",
] }

# The shared mailbox: `define` is on for the boot core only, because this image
# owns the region (it places `MAILBOX` in `.shared`) and exports its address to
# the second core. The structure itself is shared, so the field layout cannot
# drift; `xtask report` links the same crate.
ch32h417-ipc = { path = "../ipc", features = ["define"] }

qingke = { version = "0.8.4", features = ["unsafe-trust-wch-atomics", "dual-core"] }
# `highcode`: the startup copies `.highcode` from flash to RAM and `mtvec` is
# taken from there. `link.x` in this crate folds all of `.text`/`.rodata` into
# that section, so the boot core executes from the zero-wait shared SRAM.
qingke-rt = { version = "0.8.4", features = ["highcode"] }

panic-halt = "1.0"
embedded-hal = "1.0.0"
embedded-storage = "0.3.1"

embassy-executor = { version = "0.10.0", optional = true, features = [
    "platform-spin",
    "executor-thread",
] }
embassy-time = { version = "0.5.1", optional = true }
# `eth_internal` / `eth_bench`: the Ethernet stack. `auto-icmp-echo-reply`
# is what makes the device answer ping; `tcp` is only needed by the bench.
embassy-net = { version = "0.9.1", optional = true, default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "dhcpv4",
    "tcp",
    "auto-icmp-echo-reply",
    "defmt",
] }

# I2C sensor used by `src/bin/bme280_blocking.rs`.
edrv-bme280 = "0.1.1"
embedded-sdmmc = { version = "0.9.0", default-features = false }
exfat-embedded = { version = "0.1.3", default-features = false }

# `usbhs_cdc` / `usbfs_cdc` / `usbss_cdc` / `usbss_bench`: the USB device stack
# over the HAL's USBHS, USBFS and USBSS drivers.
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "e867f1210417a95be666d965a3567b3b2bed3bb9", optional = true, default-features = false, features = [
    "device",
    "class-cdc-acm",
] }

[features]
# Pulls in the H4 SysTick time driver. Other bins keep the blocking delay, which
# owns the same counter, so this stays off unless the example asks for it.
embassy = ["ch32-hal/embassy", "dep:embassy-executor", "dep:embassy-time"]

# `usbhs_cdc` / `usbfs_cdc` / `usbss_cdc` / `usbss_bench`: Embassy plus the USB
# device stack.
usb = ["embassy", "dep:embassy-usb"]

# `eth_internal` / `eth_bench`: Embassy + the Ethernet stack. `ch32-hal/defmt`
# gives `ch32_hal::eth::Error`/`Link` their `defmt::Format`, which both bins
# log. Cargo features are per crate, not per bin, so this feature can only be
# used with `--bin`: the other bins do not link a logger and would fail with
# `undefined symbol: _defmt_write`.
eth = ["embassy", "dep:embassy-net", "ch32-hal/defmt"]

# `spi_check` with PA7 (MOSI) jumpered to PA6 (MISO) verifies the received
# bytes instead of only transfer completion.
spi-loopback = []

[[bin]]
name = "embassy_systick"
path = "src/bin/embassy_systick.rs"
required-features = ["embassy"]

[[bin]]
name = "eth_internal"
path = "src/bin/eth_internal.rs"
required-features = ["eth"]

[[bin]]
name = "eth_bench"
path = "src/bin/eth_bench.rs"
required-features = ["eth"]

[[bin]]
name = "can_async_check"
path = "src/bin/can_async_check.rs"
required-features = ["embassy"]

[[bin]]
name = "usbhs_cdc"
path = "src/bin/usbhs_cdc.rs"
required-features = ["usb"]

[[bin]]
name = "usbfs_cdc"
path = "src/bin/usbfs_cdc.rs"
required-features = ["usb"]

[[bin]]
name = "usbss_host_link_check"
path = "src/bin/usbss_host_link_check.rs"
required-features = ["embassy"]

[[bin]]
name = "usbss_cdc"
path = "src/bin/usbss_cdc.rs"
required-features = ["usb"]

[[bin]]
name = "usbss_bench"
path = "src/bin/usbss_bench.rs"
required-features = ["usb"]

[profile.release]
debug = 2
strip = false
# The V3F image owns only the 64 KiB boot flash slot (`memory.x`), and
# `eth_bench` (smoltcp + defmt) is the largest bin in the crate: 63 KB of it.
# Fat LTO keeps that down. `3` rather than `"s"` is worth it here — code runs
# from the zero-wait shared SRAM, so size costs flash but not speed, and the
# benchmark gains ~8% throughput over `"s"`. That bin hits the 64 KiB limit
# first, so re-check the load image after adding to it.
lto = true
opt-level = 3
