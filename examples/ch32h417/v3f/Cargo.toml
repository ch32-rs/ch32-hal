[package]
name = "ch32h417-v3f"
version = "0.1.0"
edition = "2021"

[dependencies]
# Default to the V3F hart (boot core). For V5F examples, switch the
# feature to `ch32h417qeu6-v5f` and update the target JSON to use the
# riscv32imafbc-style profile (V5F adds the B extension and ICache).
# `embassy` stays off by default. The blocking examples own SysTick through
# `hal::delay`, and only `embassy_systick` opts into the time driver.
ch32-hal = { path = "../../../", default-features = false, features = [
    "ch32h417qeu6-v3f",
    "memory-x",
    "rt",
    "exti",
] }

# The shared mailbox: `define` is on for the boot core only, because this image
# owns the region (it places `MAILBOX` in `.shared`) and exports its address to
# the second core. The structure itself is shared, so the field layout cannot
# drift; `xtask report` links the same crate.
ch32h417-ipc = { path = "../ipc", features = ["define"] }

qingke = { version = "0.8.4", features = ["unsafe-trust-wch-atomics", "dual-core"] }
qingke-rt = { version = "0.8.4" }

panic-halt = "1.0"
embedded-hal = "1.0.0"
embedded-storage = "0.3.1"

embassy-executor = { version = "0.10.0", optional = true, features = [
    "platform-spin",
    "executor-thread",
] }
embassy-time = { version = "0.5.1", optional = true }

# I2C sensor used by `src/bin/bme280_blocking.rs`.
edrv-bme280 = "0.1.1"

[features]
# Pulls in the H4 SysTick time driver. Other bins keep the blocking delay, which
# owns the same counter, so this stays off unless the example asks for it.
embassy = ["ch32-hal/embassy", "dep:embassy-executor", "dep:embassy-time"]

# `spi_check` with PA7 (MOSI) jumpered to PA6 (MISO) verifies the received
# bytes instead of only transfer completion.
spi-loopback = []

[[bin]]
name = "embassy_systick"
path = "src/bin/embassy_systick.rs"
required-features = ["embassy"]

[profile.release]
debug = 2
strip = false
lto = false
opt-level = 3
