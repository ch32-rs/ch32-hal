[package]
name = "ch32l103-examples"
version = "0.1.0"
edition = "2021"

[dependencies]
ch32-hal = { path = "../../", features = [
    "ch32l103c8t6",
    "memory-x",
    "embassy",
    "rt",
    "time-driver-tim2",
    "defmt",
], default-features = false }
embassy-executor = { version = "0.10.0", features = [
    "platform-spin",
    "executor-thread",
] }
embassy-time = { version = "0.5.1", features = ["defmt-timestamp-uptime"] }

# This is okay because we should automatically use whatever ch32-hal uses
qingke = "0.8"
qingke-rt = "0.8"

defmt = "1"
defmt-rtt = { version = "1.3.1", features = ["disable-blocking-mode"] }
panic-halt = "1.0"
embedded-hal = "1.0.0"
embedded-can = "0.4.1"
embedded-graphics = "0.8.1"
ssd1306 = "0.9"
usbpd = "3.0.0"
usbpd-traits = "2.0.0"

[profile.release]
strip = false   # symbols are not flashed to the microcontroller, so don't strip them.
lto = true
opt-level = "z" # Optimize for size.

[profile.dev]
opt-level = 1 # At least some opt so binary is not insane
