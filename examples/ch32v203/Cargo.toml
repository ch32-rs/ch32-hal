[package]
name = "ch32v203-examples"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "usbd"
path = "src/bin/usbd.rs"
required-features = ["embassy-executor/platform-spin"]

[dependencies]
ch32-hal = { path = "../../", features = [
    "ch32v203g6u6",
    "memory-x",
    "embassy",
    "rt",
    "time-driver-tim2",
], default-features = false }

embassy-executor = { version = "0.10.0", features = [
    "platform-spin",
    "executor-thread",
] }

embassy-time = "0.5.1"
embassy-usb = { version = "0.6.0" }
embassy-usb-driver = "=0.2.2"
embassy-futures = { version = "0.1.2" }

# This is okay because we should automatically use whatever ch32-hal uses
qingke-rt = "0.8"
qingke = "0.8"

panic-halt = "1.0"

defmt = "1"
defmt-rtt = { version = "1.3.1", features = ["disable-blocking-mode"] }

display-interface-spi = "0.5.0"
embedded-hal = "1.0.0"
embedded-graphics = "0.8.1"
embedded-can = "0.4"
ssd1306 = "0.8.4"
heapless = "0.8.0"
micromath = { version = "2.1.0", features = ["num-traits"] }

# mipidsi = "0.7.1"
# embedded-hal-bus = "0.1.0"


[profile.release]
strip = false   # symbols are not flashed to the microcontroller, so don't strip them.
lto = true
opt-level = "z" # Optimize for size.

# Unreleased embassy main, for the double-buffered bulk endpoints in
# embassy-usb-driver. embassy-sync and the network crates stay on crates.io:
# main replaced embassy-net-driver with xarxa, and the released
# embassy-net-driver-channel doesn't build against main's embassy-sync.
[patch.crates-io]
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "b2c49cceb6a3c600494347ebd5c0cdb6a163f04a" }
embassy-executor-macros = { git = "https://github.com/embassy-rs/embassy", rev = "b2c49cceb6a3c600494347ebd5c0cdb6a163f04a" }
embassy-executor-timer-queue = { git = "https://github.com/embassy-rs/embassy", rev = "b2c49cceb6a3c600494347ebd5c0cdb6a163f04a" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "b2c49cceb6a3c600494347ebd5c0cdb6a163f04a" }
embassy-hal-internal = { git = "https://github.com/embassy-rs/embassy", rev = "b2c49cceb6a3c600494347ebd5c0cdb6a163f04a" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "b2c49cceb6a3c600494347ebd5c0cdb6a163f04a" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "b2c49cceb6a3c600494347ebd5c0cdb6a163f04a" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "b2c49cceb6a3c600494347ebd5c0cdb6a163f04a" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "b2c49cceb6a3c600494347ebd5c0cdb6a163f04a" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy", rev = "b2c49cceb6a3c600494347ebd5c0cdb6a163f04a" }
