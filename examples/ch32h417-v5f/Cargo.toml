[package]
name = "ch32h417-v5f"
version = "0.1.0"
edition = "2021"

[dependencies]
ch32-hal = { path = "../../", features = [
    "ch32h417qeu6-v5f",
    "memory-x",
] }
qingke = { version = "0.7" }
qingke-rt = { version = "0.7", features = ["v5f"] }
panic-halt = "1.0"

[profile.release]
debug = 2
strip = false
lto = false
opt-level = 3

# Pin qingke at the V3F/V5F PR (ch32-rs/qingke#23). Once that PR lands
# and qingke is republished, drop this patch.
[patch.crates-io]
qingke = { git = "https://github.com/ch32-rs/qingke", rev = "6043830a8d22bd8e0669bfa368ef7b73a0a63b1f" }
qingke-rt = { git = "https://github.com/ch32-rs/qingke", rev = "6043830a8d22bd8e0669bfa368ef7b73a0a63b1f" }
