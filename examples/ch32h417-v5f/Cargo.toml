[package]
name = "ch32h417-v5f"
version = "0.1.0"
edition = "2021"

[dependencies]
ch32-hal = { path = "../../", features = [
    "ch32h417qeu6-v5f",
    "memory-x",
] }
# `dual-core` gates `qingke::pfic::HartId` (read from PFIC_SCTLR), which the
# sdi_cpuid demo uses to report which hart is executing.
qingke = { version = "0.8", features = ["dual-core"] }
qingke-rt = { version = "0.8" }
panic-halt = "1.0"

[profile.release]
debug = 2
strip = false
lto = false
opt-level = 3
